<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 ナナチの部屋</title>
<link rel="stylesheet" href="/ui/room.css">
  <!-- ui_v9.css removed -->
</head>
<body>

<div class="room-bg"></div>
<div class="fireplace-glow"></div>
<div class="particles" id="particles"></div>

<!-- 左端常駐 チャット起動アイコン -->
<div class="chat-launcher" id="chatLauncher" title="チャットを開く (Enter)">
  <span class="launcher-icon">📜</span>
  <span class="launcher-label">CHAT</span>
</div>

<!-- チャットパネル（スライドイン/アウト） -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <span class="chat-title">📜 ナナチBar 帳簿</span>
    <button class="chat-close" id="chatClose" title="閉じる (Esc)">×</button>
  </div>
  <div class="chat-body">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="話しかけてみろ…" autocomplete="off">
      <button id="sendBtn">送る</button>
      <button id="micBtn" title="音声入力">🎙️</button>
    </div>
    <div class="chat-status" id="chatStatus">準備OK</div>
  </div>
</div>

<!-- ナナチ本体 -->
<div class="nanachi-wrap" id="nanachiWrap">
  <div class="nanachi-stack" id="nanachiStack">
    <img src="/ui/assets/chara/nanachi_normal.png"   data-expr="normal"   class="nanachi-face active" alt="ナナチ">
    <img src="/ui/assets/chara/nanachi_smile.png"    data-expr="smile"    class="nanachi-face" alt="">
    <img src="/ui/assets/chara/nanachi_think.png"    data-expr="think"    class="nanachi-face" alt="">
    <img src="/ui/assets/chara/nanachi_surprise.png" data-expr="surprise" class="nanachi-face" alt="">
    <img src="/ui/assets/chara/nanachi_wink.png"     data-expr="wink"     class="nanachi-face" alt="">
    <img src="/ui/assets/chara/nanachi_sleepy.png"   data-expr="sleepy"   class="nanachi-face" alt="">
    <img src="/ui/assets/chara/nanachi_smug.png"     data-expr="smug"     class="nanachi-face" alt="">
  </div>
  <div class="nanachi-shadow"></div>
</div>

<div class="speech-bubble" id="speechBubble">
  <p id="speechText">んなぁ～、よく来たな、りょーご🐰</p>
</div>

<div class="hotspot hotspot-window"     data-area="window"></div>
<div class="hotspot hotspot-fireplace"  data-area="fireplace"></div>
<div class="hotspot hotspot-bookshelf"  data-area="bookshelf"></div>

<script src="/ui/room.js"></script>
  <!-- ocr_overlay.js removed -->
  <!-- ui_v9.js removed -->
  <!-- fab_restore.js removed -->

<!-- ===== カラーAI機能ボタン群 ===== -->
<div class="color-actions-floating" id="colorActions">
    <button class="color-btn" onclick="sendQuickMsg('ランダム配色を提案して')">
        <span class="color-btn-icon">🎲</span>ランダム配色
    </button>
    <button class="color-btn" onclick="sendQuickMsg('補色を教えて')">
        <span class="color-btn-icon">🌈</span>補色生成
    </button>
    <button class="color-btn" onclick="sendQuickMsg('在庫一覧を見せて')">
        <span class="color-btn-icon">📦</span>在庫一覧
    </button>
    <button class="color-btn" onclick="uploadFabricImage()">
        <span class="color-btn-icon">📷</span>画像アップ
    </button>
    <button class="color-btn" onclick="sendQuickMsg('この色を在庫に保存')">
        <span class="color-btn-icon">💾</span>在庫保存
    </button>
    <input type="file" id="fabricFileInput" class="color-file-input" accept="image/*" onchange="handleFabricUpload(event)">
</div>

<script>
function sendQuickMsg(msg) {
    const inputEl = document.querySelector('input[type="text"], textarea');
    if (inputEl) {
        inputEl.value = msg;
        inputEl.dispatchEvent(new Event('input', {bubbles: true}));
        const sendBtn = document.querySelector('button[type="submit"], button.send, #sendBtn, [onclick*="send"]');
        if (sendBtn) {
            sendBtn.click();
        } else {
            inputEl.dispatchEvent(new KeyboardEvent('keypress', {key: 'Enter', code: 'Enter', bubbles: true}));
        }
    } else {
        console.warn('チャット入力欄が見つからない');
    }
}

function uploadFabricImage() {
    document.getElementById('fabricFileInput').click();
}

async function handleFabricUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    try {
        const response = await fetch('/upload_fabric', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();

        const replyText = data.message || data.reply || JSON.stringify(data);
        if (typeof addMessage === 'function') {
            addMessage('nanachi', replyText);
        } else {
            alert('アップロード完了: ' + replyText.substring(0, 100));
        }
    } catch (e) {
        alert('アップロード失敗: ' + e.message);
    }
}
</script>


<!-- 2026-06-30 追加: 組み合わせ提案ボタン (v3: re.sub回避版) -->
<script>
(function(){
  function addComboBtn(){
    if (document.getElementById('btnSuggestCombo')) return;
    const grid = document.getElementById('fabricGrid') || document.querySelector('.fabric-grid');
    if (!grid) { setTimeout(addComboBtn, 500); return; }
    const btn = document.createElement('button');
    btn.id = 'btnSuggestCombo';
    btn.textContent = '\u{1F3A8} 在庫から組み合わせ提案';
    btn.style.cssText = 'margin:12px;padding:10px 18px;background:#4a9eff;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;';
    btn.onclick = async () => {
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = '\u{1F504} 計算中...';
      try {
        const url = window.location.origin + '/suggest_combinations';
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({top_n: 5})
        });
        if (!res.ok) {
          throw new Error('HTTP ' + res.status + ': ' + (await res.text()).slice(0, 200));
        }
        const data = await res.json();
        const target = document.querySelector('.chat-messages')
                    || document.getElementById('chatMessages')
                    || document.querySelector('#messages')
                    || document.body;
        const txtDiv = document.createElement('div');
        txtDiv.style.cssText = 'padding:12px;margin:10px;background:#1a1a2e;color:#eee;border-radius:8px;white-space:pre-wrap;font-family:monospace;font-size:13px;';
        txtDiv.textContent = data.text || '応答取得失敗';
        target.appendChild(txtDiv);
        if (data.pairs_data && typeof renderComboPairs === 'function') {
          renderComboPairs(data.pairs_data, target);
        }
        target.scrollTop = target.scrollHeight;
      } catch(e) {
        console.error('組み合わせ提案エラー:', e);
        alert('エラー詳細: ' + (e.message || String(e)));
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };
    grid.parentNode.insertBefore(btn, grid);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addComboBtn);
  } else {
    addComboBtn();
  }
})();
</script>

</body>
</html>

<!-- ===== 在庫パネル ===== -->
<div id="fabricPanel" class="fabric-panel" style="display:none;">
    <div class="fabric-panel-header">
        <h2>📦 生地在庫</h2>
        <button class="fabric-panel-close" onclick="closeFabricPanel()">✕</button>
    </div>
    <div class="fabric-panel-body" id="fabricPanelBody">
        <div class="fabric-loading">読み込み中...</div>
    </div>
</div>

<script>
// 在庫パネル開閉・編集・削除
async function openFabricPanel() {
  const panel = document.getElementById('fabricPanel');
  const body = document.getElementById('fabricPanelBody');
  if (!panel || !body) return;
  panel.style.display = 'flex';
  body.innerHTML = '<div class="fabric-loading">読み込み中...</div>';
  try {
    const r = await fetch('/fabric_list', { cache: 'no-store' });
    const d = await r.json();
    if (!d.fabrics || d.fabrics.length === 0) {
      body.innerHTML = '<div class="fabric-empty">在庫が空だぜ</div>';
      return;
    }
    renderFabricGrid(d.fabrics);
  } catch (e) {
    body.innerHTML = '<div class="fabric-empty">取得エラー: ' + e.message + '</div>';
  }
}

function closeFabricPanel() {
  const panel = document.getElementById('fabricPanel');
  if (panel) panel.style.display = 'none';
}

async function editFabric(id, currentName, currentMemo) {
  const newName = prompt('新しい名前を入力してくれ:', currentName);
  if (newName === null || newName.trim() === '') return;
  const newMemo = prompt('メモを入力してくれ (空欄OK):', currentMemo || '');
  if (newMemo === null) return;
  try {
    const r = await fetch('/update_fabric/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName.trim(), memo: newMemo.trim() })
    });
    const d = await r.json();
    if (d.ok) {
      alert('✅ 更新完了だぜ');
      openFabricPanel();
    } else {
      alert('❌ 更新エラー: ' + (d.error || '不明'));
    }
  } catch (e) {
    alert('❌ 通信エラー: ' + e.message);
  }
}

async function deleteFabric(id, name) {
  if (!confirm('「' + name + '」を削除するぜ。本当にいいか？元に戻せねぇぞ')) return;
  try {
    const r = await fetch('/delete_fabric/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (r.ok && (d.ok || d.success || d.deleted)) {
      const card = document.querySelector('[data-id="' + id + '"]');
      if (card) card.remove();
      const body = document.getElementById('fabricPanelBody');
      if (body && !body.querySelector('.fabric-card')) {
        body.innerHTML = '<div class="fabric-empty">在庫が空だぜ</div>';
      }
    } else {
      alert('❌ 削除エラー: ' + JSON.stringify(d));
    }
  } catch (e) {
    alert('❌ 通信エラー: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const inventBtn = document.querySelector('.color-btn[onclick*="在庫一覧"]');
  if (inventBtn) inventBtn.setAttribute('onclick', 'openFabricPanel()');
});
</script>

<script>
function renderFabricGrid(fabrics) {
    const body = document.getElementById('fabricPanelBody');
    if (!fabrics.length) { body.innerHTML = '<div class="fabric-empty">在庫が空だぜ</div>'; return; }
    const grid = document.createElement('div');
    grid.className = 'fabric-grid';
    fabrics.forEach(f => grid.appendChild(makeFabricCard(f)));
    body.innerHTML = '';
    body.appendChild(grid);
}
function makeFabricCard(f) {
  const card = document.createElement('div');
  card.className = 'fabric-card';
  card.dataset.id = f.id;
  if (f.image_b64 && f.image_b64.length > 100) {
    const img = document.createElement('img');
    img.src = f.image_b64.startsWith('data:') ? f.image_b64 : 'data:image/jpeg;base64,' + f.image_b64;
    img.className = 'fabric-card-img';
    img.onclick = () => { if (typeof openLightbox === 'function') openLightbox(img.src, f.name, ''); };
    card.appendChild(img);
  }
  const nm = document.createElement('div');
  nm.className = 'fabric-card-name';
  nm.textContent = f.name;
  card.appendChild(nm);
  if (f.memo) {
    const memo = document.createElement('div');
    memo.style.cssText = 'color:#aaa;font-size:11px;margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    memo.textContent = f.memo;
    card.appendChild(memo);
  }
  card.appendChild(makeSwatchRow(f.colors || []));
  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:6px;margin-top:10px;';
  const btnEdit = document.createElement('button');
  btnEdit.textContent = '✏️ 編集';
  btnEdit.style.cssText = 'flex:1;background:#1a3a4e;color:#92caff;border:1px solid #3a6a9e;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;';
  btnEdit.onclick = (e) => { e.stopPropagation(); editFabric(f.id, f.name, f.memo || ''); };
  const btnDel = document.createElement('button');
  btnDel.textContent = '🗑 削除';
  btnDel.style.cssText = 'flex:1;background:#4a0a1a;color:#ef9a9a;border:1px solid #7a1a1a;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;';
  btnDel.onclick = (e) => { e.stopPropagation(); deleteFabric(f.id, f.name); };
  actions.appendChild(btnEdit);
  actions.appendChild(btnDel);
  card.appendChild(actions);
  return card;
}
</script>

<script>
function makeSwatchRow(colors) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;';
  colors.forEach(c => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;';
    const sw = document.createElement('div');
    sw.style.cssText = 'width:32px;height:32px;border-radius:4px;border:1px solid rgba(255,255,255,0.25);cursor:pointer;background:' + c.hex + ';';
    sw.title = (c.name_jp || '') + ' ' + c.hex + ' (' + Math.round((c.ratio||0)*100) + '%)';
    sw.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(c.hex);
      sw.style.boxShadow = '0 0 0 2px #5f5';
      setTimeout(() => { sw.style.boxShadow = ''; }, 800);
    };
    const label = document.createElement('span');
    label.style.cssText = 'font-size:10px;color:#ddd;margin-top:3px;max-width:44px;text-align:center;line-height:1.1;word-break:break-all;';
    label.textContent = c.name_jp || c.hex;
    wrap.appendChild(sw);
    wrap.appendChild(label);
    row.appendChild(wrap);
  });
  return row;
}
// 📦ボタンを openFabricPanel に差し替え
document.addEventListener('DOMContentLoaded', () => {
    const inventBtn = document.querySelector('.color-btn[onclick*="在庫一覧"]');
    if (inventBtn) inventBtn.setAttribute('onclick', 'openFabricPanel()');
});
</script>
